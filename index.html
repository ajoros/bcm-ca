<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>California water balance</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12160f;
    --ink: #f3efe4;
    --muted: #b7b1a2;
    --line: rgba(243, 239, 228, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    min-height: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 18px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0;
    font-family: Palatino, "Iowan Old Style", Georgia, serif;
    font-weight: 500;
    font-size: 22px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  #board { padding: 18px 28px 48px; display: grid; gap: 28px; }
  .day {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 16px;
    align-items: start;
  }
  .when { margin: 8px 0 0; font-size: 15px; font-weight: 600; }
  .hours { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .plots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .plot {
    appearance: none;
    border: 1px solid var(--line);
    background: #1a2118;
    color: inherit;
    border-radius: 14px;
    padding: 10px 10px 12px;
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .plot img { width: 100%; height: auto; display: block; border-radius: 8px; }
  .plot b { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; }
  .plot span { color: var(--muted); font-size: 12px; }
  #detail {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg);
  }
  body.open #detail { display: grid; }
  #detail header { position: static; }
  #detail .stage {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #detail img {
    height: calc(100vh - 168px);
    width: auto;
    max-width: 88%;
    object-fit: contain;
  }
  #detail footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 28px;
    border-top: 1px solid var(--line);
  }
  .legend { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .swatch { width: 180px; height: 8px; border-radius: 99px; }
  .swatch.run { background: linear-gradient(90deg, #d6cebe, #96becc, #2e78a8, #0c2a4e); }
  .swatch.rch { background: linear-gradient(90deg, #d6cebe, #a8c4aa, #2e8c78, #0e403a); }
  .swatch.pck { background: linear-gradient(90deg, #303a44, #7892a4, #d6e0e6, #f8fafc); }
  button.back, button.step {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--muted);
  }
  body.ready #loading { display: none; }
  @media (max-width: 800px) {
    .day { grid-template-columns: 1fr; }
    .plots { grid-template-columns: 1fr; }
    header, #board, #detail footer { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>California water balance</h1>
    <div class="sub">Click a map to open it. Arrow keys move between the open maps.</div>
  </div>
</header>
<main id="board"></main>
<div id="detail">
  <header>
    <button type="button" class="back" id="close">All maps</button>
    <div>
      <h1 id="title">—</h1>
      <div class="sub" id="meta"></div>
    </div>
    <button type="button" class="step" id="prev">Previous</button>
    <button type="button" class="step" id="next">Next</button>
  </header>
  <div class="stage"><img id="big" alt=""></div>
  <footer>
    <div id="mean"></div>
    <div class="legend"><span id="lo"></span><div class="swatch" id="swatch"></div><span id="hi"></span></div>
  </footer>
</div>
<div id="loading">Preparing the days…</div>
<script>
const names = { run: "Runoff", rch: "Recharge", pck: "Snowpack" };
const order = ["run", "rch", "pck"];
let manifest = null;
let days = [];
let openAt = null;

function label(day) {
  return new Date(day.date + "T12:00:00").toLocaleDateString("en-US", {
    weekday: "short", month: "short", day: "numeric"
  });
}

function hours(day) {
  return day.hours === 24 ? "full day" : day.hours + " of 24 hours";
}

function showDetail() {
  const spot = openAt;
  const day = days[spot.day];
  const key = spot.key;
  document.body.classList.add("open");
  document.getElementById("title").textContent = names[key];
  document.getElementById("meta").textContent = label(day) + " · " + hours(day);
  document.getElementById("mean").textContent = "Area mean " + day.mean[key].toFixed(2) + " mm";
  const scale = manifest.scales[key];
  document.getElementById("lo").textContent = scale[0] + " mm";
  document.getElementById("hi").textContent = scale[1] + " mm";
  const swatch = document.getElementById("swatch");
  swatch.className = "swatch " + key;
  const img = document.getElementById("big");
  img.src = day.images[key];
  img.alt = day.date + " " + names[key];
}

function move(step) {
  if (!openAt) return;
  const flat = [];
  days.forEach((day, dayIndex) => order.forEach((key) => flat.push({ day: dayIndex, key })));
  let index = flat.findIndex((item) => item.day === openAt.day && item.key === openAt.key);
  index = Math.min(flat.length - 1, Math.max(0, index + step));
  openAt = flat[index];
  showDetail();
}

document.getElementById("close").addEventListener("click", () => {
  document.body.classList.remove("open");
  openAt = null;
});
document.getElementById("prev").addEventListener("click", () => move(-1));
document.getElementById("next").addEventListener("click", () => move(1));
document.addEventListener("keydown", (event) => {
  if (!openAt) return;
  if (event.key === "Escape") document.getElementById("close").click();
  if (event.key === "ArrowRight") move(1);
  if (event.key === "ArrowLeft") move(-1);
});

fetch("manifest.json").then((response) => response.json()).then(async (data) => {
  manifest = data;
  days = data.days;
  const board = document.getElementById("board");
  const images = [];
  days.forEach((day, dayIndex) => {
    const row = document.createElement("section");
    row.className = "day";
    const heading = document.createElement("div");
    heading.innerHTML = "<div class='when'>" + label(day) + "</div><div class='hours'>" + hours(day) + "</div>";
    const plots = document.createElement("div");
    plots.className = "plots";
    order.forEach((key) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "plot";
      const img = document.createElement("img");
      img.alt = label(day) + " " + names[key];
      img.src = day.images[key];
      img.decoding = "async";
      button.appendChild(img);
      const title = document.createElement("b");
      title.textContent = names[key];
      const mean = document.createElement("span");
      mean.textContent = day.mean[key].toFixed(2) + " mm";
      button.appendChild(title);
      button.appendChild(mean);
      button.addEventListener("click", () => {
        openAt = { day: dayIndex, key };
        showDetail();
      });
      plots.appendChild(button);
      images.push(img);
    });
    row.appendChild(heading);
    row.appendChild(plots);
    board.appendChild(row);
  });
  await Promise.all(images.map((img) => img.decode().catch(() => {})));
  document.body.classList.add("ready");
});
</script>
</body>
</html>
