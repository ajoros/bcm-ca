<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>California water balance</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12160f;
    --ink: #f3efe4;
    --muted: #b7b1a2;
    --line: rgba(243, 239, 228, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%;
  }
  header, footer {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 18px 28px;
  }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }
  h1 {
    margin: 0;
    font-family: Palatino, "Iowan Old Style", Georgia, serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .vars { display: flex; gap: 8px; margin-left: auto; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--ink); color: #1a1d16; }
  #stage {
    position: relative;
    min-height: 0;
    background: radial-gradient(ellipse at center, #243024 0%, var(--bg) 72%);
  }
  #scroller {
    display: flex;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }
  .day {
    flex: 0 0 100%;
    width: 100%;
    min-width: 0;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .day img {
    height: calc(100vh - 168px);
    width: auto;
    max-width: 88%;
    object-fit: contain;
    display: none;
    min-width: 0;
    user-select: none;
    -webkit-user-drag: none;
  }
  body[data-var="run"] .day img.run,
  body[data-var="rch"] .day img.rch,
  body[data-var="pck"] .day img.pck { display: block; }
  .caption {
    position: absolute;
    left: 28px;
    bottom: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .now { min-width: 240px; }
  .now b { font-weight: 600; font-size: 15px; }
  .now span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .legend { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .bar {
    width: 180px;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, #d6cebe, #96becc, #2e78a8, #0c2a4e);
  }
  body[data-var="rch"] .bar {
    background: linear-gradient(90deg, #d6cebe, #a8c4aa, #2e8c78, #0e403a);
  }
  body[data-var="pck"] .bar {
    background: linear-gradient(90deg, #303a44, #7892a4, #d6e0e6, #f8fafc);
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--muted);
  }
  body.ready #loading { display: none; }
</style>
</head>
<body data-var="run">
<header>
  <div>
    <h1>California water balance</h1>
    <div class="sub">BCM daily. Recharge, runoff, and snowpack. A new RRFS cycle replaces these days every six hours.</div>
  </div>
  <div class="vars" role="group" aria-label="Variable">
    <button type="button" data-var="run" aria-pressed="true">Runoff</button>
    <button type="button" data-var="rch" aria-pressed="false">Recharge</button>
    <button type="button" data-var="pck" aria-pressed="false">Snowpack</button>
  </div>
</header>
<div id="stage">
  <div id="scroller" tabindex="0" aria-label="Forecast days"></div>
</div>
<footer>
  <div class="now"><b id="when">—</b><span id="detail"></span></div>
  <div class="legend"><span id="lo"></span><div class="bar"></div><span id="hi"></span></div>
</footer>
<div id="loading">Preparing the days…</div>
<script>
const scroller = document.getElementById("scroller");
const when = document.getElementById("when");
const detail = document.getElementById("detail");
const names = { run: "runoff", rch: "recharge", pck: "snowpack" };
let manifest = null;
let days = [];

function currentVar() { return document.body.dataset.var; }

function showDay(index) {
  const day = days[index];
  if (!day) return;
  const key = currentVar();
  when.textContent = new Date(day.date + "T12:00:00").toLocaleDateString("en-US", {
    weekday: "long", month: "long", day: "numeric"
  });
  const hours = day.hours === 24 ? "full day" : day.hours + " of 24 hours";
  detail.textContent = hours + " · area mean " + day.mean[key].toFixed(2) + " mm";
  const scale = manifest.scales[key];
  document.getElementById("lo").textContent = scale[0] + " mm";
  document.getElementById("hi").textContent = scale[1] + " mm";
}

function activeIndex() {
  const panels = [...scroller.children];
  const mid = scroller.scrollLeft + scroller.clientWidth / 2;
  let best = 0;
  let dist = Infinity;
  panels.forEach((panel, i) => {
    const center = panel.offsetLeft + panel.offsetWidth / 2;
    const gap = Math.abs(center - mid);
    if (gap < dist) { dist = gap; best = i; }
  });
  return best;
}

document.querySelectorAll(".vars button").forEach((button) => {
  button.addEventListener("click", () => {
    document.body.dataset.var = button.dataset.var;
    document.querySelectorAll(".vars button").forEach((other) => {
      other.setAttribute("aria-pressed", other === button ? "true" : "false");
    });
    showDay(activeIndex());
  });
});

scroller.addEventListener("scroll", () => showDay(activeIndex()), { passive: true });
scroller.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  event.preventDefault();
  const dir = event.key === "ArrowRight" ? 1 : -1;
  scroller.scrollTo({ left: scroller.scrollLeft + dir * scroller.clientWidth, behavior: "smooth" });
});

fetch("manifest.json").then((response) => response.json()).then(async (data) => {
  manifest = data;
  days = data.days;
  const images = [];
  for (const day of days) {
    const panel = document.createElement("section");
    panel.className = "day";
    for (const key of ["run", "rch", "pck"]) {
      const img = document.createElement("img");
      img.className = key;
      img.alt = day.date + " " + names[key];
      img.src = day.images[key];
      img.decoding = "sync";
      panel.appendChild(img);
      images.push(img);
    }
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = day.date;
    panel.appendChild(cap);
    scroller.appendChild(panel);
  }
  await Promise.all(images.map((img) => img.decode()));
  document.body.classList.add("ready");
  showDay(0);
  scroller.focus();
});
</script>
</body>
</html>
